# mission.yaml — owned by Member B.
# ROS 2 parameter file for mission_node.

/**:
  ros__parameters:
    # Search area: 60 x 60 m centered at origin (world frame, ENU)
    area_size_x: 60.0      # metres
    area_size_y: 60.0      # metres
    area_center: [0.0, 0.0]  # [x, y]

    # Survey altitude (m AGL)
    altitude: 10.0

    # Maximum speeds
    speed_horizontal: 2.0  # m/s
    speed_vertical: 1.0    # m/s

    # Lawnmower row overlap fraction (0–1)
    overlap: 0.3

    # Home position (where drone spawns and returns to land)
    home: [0.0, 0.0]

    # Safety
    geofence_margin: 5.0   # metres
    waypoint_timeout: 30.0  # seconds
    altitude_floor: 1.5     # metres

    # State machine
    takeoff_altitude: 10.0  # metres
    hfov_rad: 1.2
